services:
  redis-1:
    build: .
    hostname: redis-1
    environment:
      - PEERS=redis-2:6379,redis-3:6379
    networks:
      - redis-net

  redis-2:
    build: .
    hostname: redis-2
    environment:
      - PEERS=redis-1:6379,redis-3:6379
    networks:
      - redis-net

  redis-3:
    build: .
    hostname: redis-3
    environment:
      - PEERS=redis-1:6379,redis-2:6379
    networks:
      - redis-net

  # HAProxy kept for standard redis-cli compatibility (optional)
  haproxy:
    image: haproxy:2.4
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${PORT:-6379}:6379"
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    networks:
      - redis-net

  # The "Real Client" Example
  client-app:
    build: 
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    networks:
      - redis-net

networks:
  redis-net: