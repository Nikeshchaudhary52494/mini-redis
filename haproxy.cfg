defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend redis-frontend
    bind *:6379
    default_backend redis-backend

backend redis-backend
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send INFO\ replication\r\n
    tcp-check expect string role:leader
    server redis-1 redis-1:6379 check inter 1s fall 3 rise 2
    server redis-2 redis-2:6379 check inter 1s fall 3 rise 2
    server redis-3 redis-3:6379 check inter 1s fall 3 rise 2


